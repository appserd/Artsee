name: Artsee
options:
  bundleIdPrefix: com.appserd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: "YES"
targets:
  Artsee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Artsee
    info:
      path: Artsee/Info.plist
      properties:
        CFBundleDisplayName: Artsee
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, arkit]
        NSCameraUsageDescription: "Artsee uses your camera to scan artwork and to measure it next to a reference object."
        NSPhotoLibraryUsageDescription: "Artsee lets you import artwork photos from your library."
        NSPhotoLibraryAddUsageDescription: "Artsee saves your AR wall mockups to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appserd.artsee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Artsee/Artsee.entitlements
      properties: {}
